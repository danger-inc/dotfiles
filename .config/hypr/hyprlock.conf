# * Modern Clean Lockscreen - Large Clock *

# --- 🎨 COLOR DYNAMICS (PYWAL) ---
source = $HOME/.cache/ist/colors-hyprlock.conf

# --- 🖼️ BACKGROUND / ARKA PLAN ---
background {
    monitor =
    path = @HOME@/.cache/current_wallpaper.png
    blur_passes = 3
    contrast = 0.8
    brightness = 0.5
    vignette = 0.5
    vignette_opacity = 0.3
    crossfade_time = 0.5
}

# --- 🕒 VERTICAL CLOCK (UPPER - HOUR) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    color = $color1
    font_size = 220
    font_family = Outfit ExtraLight, JetBrains Mono Nerd Font ExtraLight, Sans
    position = 0, 300
    halign = center
    valign = center
}

# --- 🕒 VERTICAL CLOCK (LOWER - MINUTE) ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = $foreground
    font_size = 220
    font_family = Outfit Light, JetBrains Mono Nerd Font ExtraLight, Sans
    position = 0, 80
    halign = center
    valign = center
}

# --- 📅 CALENDAR / TAKVİM ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %d. %B")"
    color = $color7
    font_size = 28
    font_family = Outfit, JetBrains Mono Nerd Font Light
    position = 0, -80
    halign = center
    valign = center
}

# --- 👤 PROFILE IMAGE / PROFİL RESMİ ---
image {
    monitor =
    path = @HOME@/.cache/current_wallpaper.png
        
    size = 700
    rounding = -1
    border_size = 4
    border_color = $color2
    position = 0, 525
    halign = center
    valign = bottom
}

# --- ⌨️ INPUT FIELD / ŞİFRE ALANI ---
input-field {
    monitor =
    size = 315, 60
    outline_thickness = 2
    dots_size = 0.3
    dots_spacing = 0.15
    dots_center = true
    outer_color = $color2
    inner_color = $background
    font_color = $foreground
    check_color = $color3
    fail_color = $color1
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 100
    halign = center
    valign = bottom
}

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}
