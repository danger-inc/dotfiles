# * -ist Lockscreen: Terminal-Look (fcknzs) *
# Farben folgen Hell/Dunkel + Preset über ~/.cache/ist/colors-hyprlock.conf
source = $HOME/.cache/ist/colors-hyprlock.conf

background {
    monitor =
    path = @HOME@/.cache/current_wallpaper.png
    blur_passes = 3
    contrast = 0.8
    brightness = 0.45
    vignette = 0.5
    vignette_opacity = 0.3
    crossfade_time = 0.5
}

# --- Prompt 1: fcknzs@arch ~ $ lock ---
# Name und Rest sind getrennte Labels (Leerzeichen halten die Mono-Spalten frei)
label {
    monitor =
    text = fcknzs
    color = $color2
    font_size = 22
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 160, -300
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:0] echo "@arch ~ \$ lock"
    color = $color3
    font_size = 22
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 268, -300
    halign = left
    valign = top
}

# --- Uhr: Stunde Primär, ":" + Minute hell ---
label {
    monitor =
    text = cmd[update:1000] date +%H
    color = $color1
    font_size = 230
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 140, -360
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:1000] echo ":$(date +%M)"
    color = $foreground
    font_size = 230
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 516, -360
    halign = left
    valign = top
}

# --- Datum ---
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/lock-date.sh
    color = $color2
    font_size = 22
    font_family = JetBrainsMono Nerd Font Bold
    position = 160, -820
    halign = left
    valign = top
}

# --- Prompt 2: fcknzs@arch password: ●●● ---
label {
    monitor =
    text = fcknzs
    color = $color2
    font_size = 22
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 160, -930
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:0] echo "@arch password:"
    color = $color3
    font_size = 22
    font_family = JetBrainsMono Nerd Font ExtraBold
    position = 268, -930
    halign = left
    valign = top
}
input-field {
    monitor =
    size = 700, 80
    outline_thickness = 0
    rounding = 0
    dots_text_format = *
    font_size = 44
    dots_spacing = 0
    dots_center = false
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = $color1
    check_color = $color3
    fail_color = $color1
    font_family = JetBrainsMono Nerd Font ExtraBold
    placeholder_text =
    fail_text = <i>falsch ($ATTEMPTS)</i>
    fade_on_empty = false
    hide_input = false
    position = 548, -900
    halign = left
    valign = top
}

general {
    no_fade_in = false
    grace = 0
    disable_loading = true
}
