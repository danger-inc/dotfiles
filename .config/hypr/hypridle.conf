general {
    lock_cmd = ~/.config/hypr/lock.sh           # lock command
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # screen on after wake-up
}

listener {
    timeout = 600                               # 10 minutes idle
    on-timeout = loginctl lock-session          # lock the screen
}

listener {
    timeout = 630                               # shortly after locking
    on-timeout = hyprctl dispatch dpms off      # screen off (power saving)
    on-resume = hyprctl dispatch dpms on        # back on at the first movement
}
